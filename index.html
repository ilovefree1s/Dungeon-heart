<style>

    let y = mp.getY(i) + dt * 0.25; if (y > 7) y = 0;
    mp.setY(i, y); mp.setX(i, mp.getX(i) + Math.sin(t * 0.5 + i) * dt * 0.2);
  }
  mp.needsUpdate = true;
  for (let i = nums.length - 1; i >= 0; i--) {
    const n = nums[i]; n.t += dt;
    if (n.t > 0.9) { n.el.remove(); nums.splice(i, 1); continue; }
    tmpV.set(n.x, n.y + n.t * 2.2, n.z).project(camera);
    n.el.style.left = ((tmpV.x + 1) / 2 * innerWidth) + 'px'; n.el.style.top = ((1 - tmpV.y) / 2 * innerHeight) + 'px';
    n.el.style.opacity = n.t < 0.6 ? 1 : 1 - (n.t - 0.6) / 0.3;
  }
  if (bannerT > 0) { bannerT -= dt; if (bannerT <= 0) $('banner').classList.remove('on'); }
  if (toastT > 0) { toastT -= dt; if (toastT <= 0) $('toast').classList.remove('on'); }
  if (t > 9) $('help').style.opacity = 0.55;
  if (shake.t > 0) { shake.t -= dt; shake.x = (Math.random() - 0.5) * 0.5; shake.z = (Math.random() - 0.5) * 0.5; } else { shake.x = shake.z = 0; }
  placeCamera(P.x, P.z, false);
  sun.position.set(camFocus.x - 14, 40, camFocus.z + 18); sun.target.position.set(camFocus.x, 0, camFocus.z);
}
function swingHits() {
  // the sword reaches 4 units in a wide arc in front (the SNES slash covers about the same)
  for (const s of slimes) {
    if (s.dead) continue;
    const dx = s.x - P.x, dz = s.z - P.z, d = Math.hypot(dx, dz);
    let a = Math.atan2(dx, dz) - hero.rotation.y; a = Math.atan2(Math.sin(a), Math.cos(a));
    if (d > 4.6 || Math.abs(a) > 1.3) continue;
    // damage: ATK in sixths to points, the remainder as a chance; 1 in 16 crits (game.c roll_damage)
    const fine = S.atk + (Math.random() < 0.5 ? 6 : 0);
    let dmg = Math.floor(fine / 6) + (Math.random() * 6 < fine % 6 ? 1 : 0);
    const crit = Math.random() < 0.0625; if (crit) dmg *= 2;
    s.hp -= dmg; s.flash = 0.12; s.kb = 0.18; s.kx = dx / d * 16; s.kz = dz / d * 16;
    num(s.x, 2.6, s.z, crit ? dmg + '!' : String(dmg), crit ? 'crit' : '');
    puff(s.x, 1, s.z, '#7dff86', 6, 5, 0.6, true);
    shake.t = 0.08; SFX.hit();
    if (s.hp <= 0) {
      s.dead = true; s.dt = 0; SFX.squish();
      puff(s.x, 0.9, s.z, '#5ee05a', 18, 8, 1.1);
      dropCoins(s.x, s.z, 2 + Math.floor(Math.random() * 3));
      if (++S.kills === 2) { const o = { x: s.x, z: s.z }; collide(o, 1.6); dropItem(o.x, o.z); }
      // XP: 2 base + depth / 2, doubled (game.c, 50 floors)
      S.xp += 4;
      if (S.xp >= S.xpnext) {
        S.xp -= S.xpnext; S.lvl++; S.xpnext = 8 + S.lvl * 8 + Math.floor(S.lvl * S.lvl / 4);
        S.maxhp += 4; S.hp = S.maxhp; if (S.lvl & 1) S.atk += 6;
        banner('LEVEL ' + S.lvl + '!', S.lvl & 1 ? 'STRONGER!' : '+1 TALENT POINT', 1.6);
        puff(P.x, 2, P.z, '#ffd36a', 22, 7, 0.9, true); SFX.level();
      }
      hud();
    }
  }
}

// ------------------------------------------------------------ go
let tt = 0;
roomStart(true); hud(); placeCamera(P.x, P.z, true);
window.__dh = { S, P, slimes, door, step(n) { for (let i = 0; i < n; i++) { tt += 1 / 60; update(1 / 60, tt); } } };
const clock = new THREE.Clock();
function frame() {
  const dt = Math.min(0.05, clock.getDelta());
  tt += RM ? 0 : dt;
  if (!RM) update(dt, tt); else update(0.0001, 1);
  composer.render();
  requestAnimationFrame(frame);
}
frame();
</script>
